<div class="col">
    <div class="card h-100">
        <div class="ratio ratio-4x3">
            {% if event.image %}
                <img src="{{ event.image.url }}" class="object-fit-cover" alt="{{ event.title }}">
            {% else %}
                <div class="bg-light d-flex align-items-center justify-content-center fs-4">Нет изображения</div>
            {% endif %}
        </div>
        <div class="card-body d-flex flex-column">
            <h5 class="card-title">{{ event.title }}</h5>
            <p class="card-text">{{ event.short_description|truncatewords:25 }}</p>
            <p class="card-text text-muted mb-0">{{ event.date|date:"d.m.Y H:i" }}</p>
            <p class="card-text">{{ event.location }}</p>
            <a href="{% url 'details' event.id %}" class="btn btn-primary mt-auto align-self-start">Подробнее</a>
        </div>
    </div>
</div>
