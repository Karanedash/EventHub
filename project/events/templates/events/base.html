<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EventHub{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
    <header class="text-center py-4 mb-4">
        <h1 class="display-4">EventHub</h1>
        <nav class="navbar justify-content-center bg-dark">
            <ul class="nav gap-3">
                <li class="nav-item">
                    <a href="{% url 'main' %}" class="nav-link text-white">Главная</a>
                </li>
                {% if request.path == "/" %}
                <li class="nav-item">
                    <a href="#description" class="nav-link text-white">Описание проекта</a>
                </li>
                <li class="nav-item">
                    <a href="#closest" class="nav-link text-white">Ближайшие мероприятия</a>
                </li>
                {% endif %}
                <li class="nav-item">
                    <a href="{% url 'event_list' %}" class="nav-link text-white">Полный список мероприятий</a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="container my-4 flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-light text-center py-3 mt-auto">
        <small class="text-muted">© 2026 EventHub</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
